version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: orbit-pilot-backend
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./orbit_pilot.db
      - FRONTEND_URL=http://localhost:5173
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=orbit-pilot
      - KEYCLOAK_CLIENT_ID=orbit-pilot-frontend
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - DEMO_MODE=true
    volumes:
      - ./backend:/app:ro
      - orbit-pilot-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: orbit-pilot-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: orbit-pilot-keycloak
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USER=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  orbit-pilot-data:
  keycloak-data: